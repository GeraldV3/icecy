<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Project EYES Chat</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0f172a;
      }
    </style>
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const userId = urlParams.get("userId") || "anonymous";

      const configScript = document.createElement("script");
      configScript.src =
        "https://files.bpcontent.cloud/2025/01/06/08/20250106081719-V5JOYPJH.js";

      configScript.onload = function () {
        // ✅ This overrides the userId AFTER loading the config
        window.botpressWebChat.init({ userId });

        // ✅ Show the chat when it's ready
        window.botpressWebChat.onEvent(() => {
          window.botpressWebChat.sendEvent({ type: "show" });
        }, ["LIFECYCLE.LOADED"]);
      };

      document.head.appendChild(configScript);
    </script>
  </head>
  <body>
    <script src="https://cdn.botpress.cloud/webchat/v2/inject.js"></script>
  </body>
</html>
